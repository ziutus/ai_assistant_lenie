apiVersion: v1
kind: Service
metadata:
  name: lenie-ai-server
spec:
  selector: {app: lenie-ai-server}
  ports:
    - {name: http, port: 5000, targetPort: 5000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lenie-ai-server
spec:
  replicas: 1
  selector:
    matchLabels: {app: lenie-ai-server}
  template:
    metadata:
      labels: {app: lenie-ai-server}
    spec:
      containers:
        - name: server
          image: lenie-ai-server
          ports:
            - {name: http, containerPort: 5000}
          envFrom:
            - secretRef: {name: lenie-env}
          startupProbe:
            httpGet: {path: /startup, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /liveness, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
