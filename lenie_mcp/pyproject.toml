[project]
name = "lenie-mcp"
version = "0.1.0"
description = "Local stdio MCP server: create Obsidian notes from Lenie documents (ADR-030)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
lenie-mcp = "lenie_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lenie_mcp"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
testpaths = ["tests"]
